# =============================================================================
# Elite Tech Academy — production on ONE server (docs/DEPLOY.md).
#
# Always run it through the wrapper, which uses .env.production:
#   ./scripts/prod.sh up -d --build        start / update everything
#   ./scripts/prod.sh run --rm migrate     apply database migrations
#   ./scripts/prod.sh run --rm seed        first admin + catalogue (pnpm db:seed)
#   ./scripts/prod.sh run --rm backup backup | list | restore latest
#
# Only Caddy publishes ports (80/443). Postgres and Redis sit on an internal
# network with no route to the internet and no published port. ClamAV, the API
# and the web app are reachable only from other containers.
#
# Memory limits are sized for a 4 GB server (about 3.2 GB in total, the rest for
# the OS and Docker). Each one can be changed in .env.production.
# =============================================================================

name: elite-tech

x-logging: &logging # Cap container logs so they never fill the disk.
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Settings shared by the API and the one-off seed (same image, same config).
x-api-env: &api-env
  NODE_ENV: production
  WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.production}
  API_PORT: ${API_PORT:-4000}
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: runtime
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}

services:
  # ---- Edge: HTTPS, the only thing the internet can reach --------------------
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
      WEB_UPSTREAM: web:3000
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - ./deploy/caddy/sites-enabled:/etc/caddy/sites-enabled:ro
      - caddy-data:/data # certificates — keep this volume
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY:-96m}
    logging: *logging

  # ---- Next.js website (forwards /api/* to the API) -------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        # Fixed into the build by Next.js (see apps/web/Dockerfile).
        API_INTERNAL_URL: http://api:${API_PORT:-4000}
        WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.production}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    image: elite-tech/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env.production}
      API_INTERNAL_URL: http://api:${API_PORT:-4000}
      MEDIA_ORIGINS: ${MEDIA_ORIGINS:?set MEDIA_ORIGINS in .env.production}
      # Passes the visitor's IP on to the API when pages are rendered on the server.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      NODE_OPTIONS: --max-old-space-size=${WEB_NODE_HEAP_MB:-256}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # A static route: says "the server answers" without depending on the API.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/robots.txt']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [edge, app]
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-384m}
    logging: *logging

  # ---- NestJS API + BullMQ workers (mail, file scans…) in one process --------
  api:
    build: *api-build
    image: elite-tech/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${ENV_FILE:-.env.production}
    environment:
      <<: *api-env
      NODE_OPTIONS: --max-old-space-size=${API_NODE_HEAP_MB:-384}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        # The first start downloads the virus database (a few minutes); the API
        # does not wait for it. Uploads are scanned by a retrying background job.
        condition: service_started
    healthcheck:
      # Checks the database and Redis too (apps/api/src/modules/health).
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks: [app, data]
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-512m}
    logging: *logging

  # ---- Data: internal network only ------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    shm_size: 128m
    networks: [data]
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-512m}
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      # Password from the environment (never on the command line shown by `ps`).
      # noeviction: BullMQ job queues must never lose keys under memory pressure.
      - >-
        exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-128mb}
        --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY:-192m}
    logging: *logging

  # Virus scanner (spec §9). Needs the internet to update its database (freshclam).
  clamav:
    # ARM servers (e.g. Hetzner CAX): CLAMAV_IMAGE=clamav/clamav-debian:1.4 (set by configure.sh).
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    restart: unless-stopped
    environment:
      # Uploads are limited to 100 MB; ClamAV's default stream limit is 25 MB.
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      # Reload the virus database in place instead of loading a second copy
      # first: halves peak memory; scans pause for a few seconds during a reload.
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    networks: [app, data]
    deploy:
      resources:
        limits:
          memory: ${CLAMAV_MEMORY:-1400m}
    logging: *logging

  # ---- Optional: file storage on this server instead of R2 -------------------
  # Enabled with COMPOSE_PROFILES=local-storage (scripts/server/configure.sh).
  # Browsers download through Caddy at https://FILES_DOMAIN (signed links only).
  storage:
    profiles: [local-storage]
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    command:
      - --access
      - ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID}
      - --secret
      - ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY}
      - --port
      - ':9000'
      - posix
      - /data
    volumes:
      - storage-data:/data
    networks: [edge, app]
    deploy:
      resources:
        limits:
          memory: ${STORAGE_MEMORY:-128m}
    logging: *logging

  # ---- Nightly database backup to a separate R2 bucket ----------------------
  backup:
    build:
      context: deploy/backup
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:17-alpine}
    image: elite-tech/backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgres}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?set BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?set BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data]
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY:-128m}
    logging: *logging

  # ---- One-off jobs (profile "ops": never started by `up`) -------------------
  # Applies pending Prisma migrations (packages/db/prisma/migrations).
  migrate:
    profiles: [ops]
    build:
      <<: *api-build
      target: migrate
    image: elite-tech/migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  # Same as `pnpm db:seed`: first admin (SEED_ADMIN_*) + public catalogue. Safe to re-run.
  seed:
    profiles: [ops]
    build: *api-build
    image: elite-tech/api:${IMAGE_TAG:-latest}
    restart: 'no'
    env_file:
      - path: ${ENV_FILE:-.env.production}
    environment: *api-env
    command: ['sh', '-c', 'node dist/scripts/seed-admin.js && node dist/scripts/seed-content.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]

networks:
  # Caddy ↔ web.
  edge:
  # web ↔ API, and the way out to the internet for the API (SMTP, R2, captcha,
  # breached-password check), ClamAV (virus database) and backups (R2).
  app:
  # Databases. internal: no internet access in or out.
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  clamav-data:
  caddy-data:
  caddy-config:
  storage-data:
