packages:
  - apps/*
  - packages/*

# Supply-chain protection: never install a version published less than 7 days ago
# (gives the community time to catch hijacked releases). Value is in minutes.
minimumReleaseAge: 10080

# pnpm 10 blocks install scripts by default; only these packages may run them.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Security patches for transitive dependencies (found by `pnpm audit`).
# mysql2 / deepmerge-ts come from the Prisma CLI (dev tooling); js-yaml from @nestjs/swagger.
overrides:
  mysql2@<3.23.1: ^3.23.1
  deepmerge-ts@<8.0.0: ^8.0.0
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
